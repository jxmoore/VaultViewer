name: Tests

on:
  push:
    branches-ignore:
      - main
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore tests/VaultViewer.Tests/VaultViewer.Tests.csproj
      - run: dotnet test tests/VaultViewer.Tests/VaultViewer.Tests.csproj --no-restore --configuration Release
