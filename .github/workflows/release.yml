name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '6.x'

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run tests
        run: dotnet test tests/VaultViewer.Tests/VaultViewer.Tests.csproj --configuration Release

      - name: Publish (self-contained, includes .NET runtime)
        run: dotnet publish VaultViewer.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true --output ./publish-selfcontained

      - name: Publish (framework-dependent, requires .NET 8 Desktop Runtime)
        run: dotnet publish VaultViewer.csproj --configuration Release --runtime win-x64 --self-contained false -p:PublishSingleFile=true --output ./publish-framework-dependent

      - name: Package binaries
        shell: pwsh
        run: |
          Compress-Archive -Path ./publish-selfcontained/* -DestinationPath VaultViewer-win-x64-selfcontained.zip
          Compress-Archive -Path ./publish-framework-dependent/* -DestinationPath VaultViewer-win-x64-net8-required.zip

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.gitversion.outputs.MajorMinorPatch }}
        run: |
          # Idempotent: a rerun after a partial failure (see below) must not choke
          # trying to recreate a release that already exists.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "VaultViewer $TAG" \
              --generate-notes
          fi

          # Asset uploads to GitHub's Releases API occasionally fail on large files
          # with a transient 500 ("Error saving asset"); retry a few times before
          # giving up rather than leaving the release without its binaries.
          for file in VaultViewer-win-x64-selfcontained.zip VaultViewer-win-x64-net8-required.zip; do
            for attempt in 1 2 3; do
              if gh release upload "$TAG" "$file" --clobber; then
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "::error::Failed to upload $file after 3 attempts"
                exit 1
              fi
              echo "Upload of $file failed (attempt $attempt/3); retrying in 15s…"
              sleep 15
            done
          done
